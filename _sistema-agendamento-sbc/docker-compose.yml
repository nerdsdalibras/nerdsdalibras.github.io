# Referência para homologação. Em produção, use PostgreSQL gerenciado/backup externo e proxy HTTPS.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-sgi}
      POSTGRES_USER: ${DB_USER:-sgi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes: [dbdata:/var/lib/postgresql/data]
  app:
    build: .
    env_file: .env
    environment: { DB_HOST: db }
    depends_on: [db]
    ports: ["127.0.0.1:8000:8000"]
    volumes: [media:/var/lib/sgi/media]
  notificacoes:
    build: .
    env_file: .env
    environment: { DB_HOST: db }
    depends_on: [db]
    command: sh -c "while true; do python manage.py processar_notificacoes; sleep 120; done"
volumes: { dbdata: {}, media: {} }
